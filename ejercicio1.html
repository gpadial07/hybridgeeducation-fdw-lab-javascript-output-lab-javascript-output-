
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1</title>
</head>
<body>

    <p id="mensaje"></p>

    <button onclick="cambiarTexto()">
        Cambiar texto
    </button>

    <script>
        function cambiarTexto() {
            document.getElementById("mensaje").innerHTML =
                "¡Texto actualizado con Javascript!";
        }
    </script>

</body>
</html>
